name = "lobsters-daily-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 23 * * *"]

[vars]
GITHUB_REPO = "real-jiakai/lobsters-daily"
GITHUB_BRANCH = "main"
DIGEST_TOP_N = "10"

# Set this as a secret via `wrangler secret put`:
# wrangler secret put GITHUB_TOKEN
